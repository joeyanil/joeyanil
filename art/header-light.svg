<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Joey A, full-stack engineer, AI and data science, security" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#F8FAFF"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284C7"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#7C3AED" stop-opacity=".30"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#0F172A" fill-opacity=".06"/></pattern>
<clipPath id="page"><rect width="1200" height="320" rx="24"/></clipPath>
<clipPath id="panel"><rect x="48" y="40" width="1104" height="240" rx="22"/></clipPath>
</defs>
<style>
.r{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spin{transform-origin:1000px 160px;animation:spin 24s linear infinite}
.spin2{transform-origin:1000px 160px;animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#page)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)"/>
<g filter="url(#blur)">
<circle cx="200" cy="90" r="120" fill="#38BDF8" fill-opacity=".45"><animateTransform attributeName="transform" type="translate" values="0 0;140 60;40 -20;0 0" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="260" r="130" fill="#8B5CF6" fill-opacity=".45"><animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;60 -40;0 0" dur="19s" repeatCount="indefinite"/></circle>
<circle cx="1060" cy="70" r="100" fill="#F0ABFC" fill-opacity=".45"><animateTransform attributeName="transform" type="translate" values="0 0;-90 70;30 40;0 0" dur="14s" repeatCount="indefinite"/></circle>
</g>
<rect x="48" y="40" width="1104" height="240" rx="22" fill="#FFFFFF" fill-opacity=".55"/>
<g clip-path="url(#panel)"><rect x="-300" y="30" width="260" height="260" fill="url(#shine)" transform="skewX(-20)"><animateTransform attributeName="transform" type="translate" values="0 0;1700 0;1700 0" keyTimes="0;.45;1" dur="8s" repeatCount="indefinite" additive="sum"/></rect></g>
<rect x="48.5" y="40.5" width="1103" height="239" rx="22" fill="none" stroke="url(#gs)" stroke-width="1.5"/>
<g>
<g class="r" style="animation-delay:.2s"><text x="100" y="98" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" fill="#0369A1">~/joeyanil <tspan fill="#475569">$</tspan> whoami</text></g>
<g class="r" style="animation-delay:.45s"><text x="96" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#acc)">Joey A</text></g>
<g class="r" style="animation-delay:.8s"><text x="100" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#0F172A" fill-opacity=".88">Building software, models and safer systems.</text></g>
<g class="r" style="animation-delay:1.20s"><rect x="100" y="236" width="110" height="30" rx="15" fill="#FFFFFF" fill-opacity=".6" stroke="url(#acc)" stroke-opacity=".6"/><text x="155" y="256" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="1">FULL STACK</text></g><g class="r" style="animation-delay:1.32s"><rect x="222.0" y="236" width="82" height="30" rx="15" fill="#FFFFFF" fill-opacity=".6" stroke="url(#acc)" stroke-opacity=".6"/><text x="263" y="256" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="1">AI / ML</text></g><g class="r" style="animation-delay:1.44s"><rect x="316.4" y="236" width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity=".6" stroke="url(#acc)" stroke-opacity=".6"/><text x="381" y="256" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="1">DATA SCIENCE</text></g><g class="r" style="animation-delay:1.56s"><rect x="456.79999999999995" y="236" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity=".6" stroke="url(#acc)" stroke-opacity=".6"/><text x="503" y="256" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="1">SECURITY</text></g>
</g>
<g class="r" style="animation-delay:.6s">
<circle cx="1000" cy="160" r="86" fill="none" stroke="#0284C7" stroke-opacity=".25"/>
<g class="spin"><circle cx="1000" cy="160" r="86" fill="none" stroke="url(#acc)" stroke-width="2" stroke-dasharray="90 450" stroke-linecap="round"/><circle cx="1086" cy="160" r="5" fill="#0284C7"/></g>
<g class="spin2"><circle cx="1000" cy="160" r="62" fill="none" stroke="#7C3AED" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round"/></g>
<circle cx="1000" cy="160" r="44" fill="#FFFFFF" fill-opacity=".7" stroke="url(#gs)" stroke-width="1.5"/>
<text x="1000" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#acc)">JA</text>
</g>
<g class="r" style="animation-delay:1s"><circle class="pulse" cx="1072" cy="76" r="5" fill="#22C55E"/><text x="1086" y="81" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#475569">online</text></g>
</g>
</svg>